<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TambahAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #fbfbfd;
      --surface: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --grad-start: #6e3bfd;
      --grad-end: #0071e3;
      --border: rgba(0,0,0,0.08);
      --radius: 16px;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
    }
    .logo {
      font-weight: 700; font-size: 1.15rem;
      background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; text-decoration: none;
    }
    .nav-link {
      color: var(--text-secondary); font-size: 0.9rem; text-decoration: none;
    }
    .nav-link:hover { color: var(--accent); }

    /* ── AUTH PAGE ── */
    .auth-page {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 24px;
    }
    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 48px 36px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.06);
    }
    .auth-title {
      font-size: 1.6rem; font-weight: 700; text-align: center;
      margin-bottom: 6px;
    }
    .auth-sub {
      text-align: center; color: var(--text-secondary);
      font-size: 0.92rem; margin-bottom: 32px;
    }

    /* Tab switcher */
    .tab-switch {
      display: flex; background: #f2f2f7; border-radius: 10px;
      padding: 3px; margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1; padding: 10px; border: none; background: none;
      font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);
      border-radius: 8px; cursor: pointer; transition: all 0.25s;
      font-family: inherit;
    }
    .tab-btn.active {
      background: #fff; color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 0.82rem; font-weight: 600;
      color: var(--text-secondary); margin-bottom: 6px;
    }
    .form-group input {
      width: 100%; padding: 13px 16px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none; background: var(--bg);
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,113,227,0.1);
    }
    .btn-submit {
      width: 100%; padding: 14px; border: none;
      background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
      color: #fff; font-size: 1rem; font-weight: 600;
      border-radius: 12px; cursor: pointer;
      font-family: inherit; transition: opacity 0.2s, transform 0.2s;
      margin-top: 4px;
    }
    .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }

    .demo-note {
      margin-top: 20px; padding: 14px;
      background: rgba(0,113,227,0.04); border-radius: 10px;
      font-size: 0.8rem; color: var(--text-secondary);
      text-align: center; line-height: 1.5;
    }
    .demo-note strong { color: var(--accent); }

    /* Hidden form */
    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--text-secondary); font-size: 0.82rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* Role badge on dashboard link */
    .role-select { margin-bottom: 18px; }
    .role-select select {
      width: 100%; padding: 13px 16px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 0.95rem; font-family: inherit;
      background: var(--bg); outline: none; appearance: none;
      cursor: pointer;
    }

    footer {
      text-align: center; padding: 24px;
      font-size: 0.8rem; color: var(--text-secondary);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 480px) {
      .auth-card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

<!-- ═══ NAV ═══ -->
<nav>
  <a href="index.html" class="logo">TambahAI</a>
  <a href="index.html" class="nav-link">← Kembali</a>
</nav>

<!-- ═══ AUTH ═══ -->
<div class="auth-page">
  <div class="auth-card">

    <h2 class="auth-title">Selamat Datang</h2>
    <p class="auth-sub">Masuk atau daftar untuk mulai konsultasi</p>

    <!-- Tab Switch -->
    <div class="tab-switch">
      <button class="tab-btn active" data-tab="login">Masuk</button>
      <button class="tab-btn" data-tab="register">Daftar</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form-panel active" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn-submit">Masuk →</button>
      <div class="demo-note">
        <strong>Demo:</strong> email & password bebas diisi.<br>Klik masuk dan langsung ke dashboard.
      </div>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="form-panel" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" placeholder="Nama kamu" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Buat password (min 6 karakter)" minlength="6" required>
      </div>
      <div class="role-select">
        <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--text-secondary);margin-bottom:6px;">Role Akun</label>
        <select id="roleSelect">
          <option value="admin">Admin</option>
          <option value="operator" selected>Operator</option>
          <option value="viewer">Viewer</option>
        </select>
      </div>
      <button type="submit" class="btn-submit">Daftar →</button>
      <div class="demo-note">
        Pilih role untuk demo permission.<br>Nanti di dashboard tampilan tiap role beda.
      </div>
    </form>
  </div>
</div>

<footer>
  © 2026 <a href="index.html">TambahAI</a> — Konsultasi bisnis cerdas dari percakapan.
</footer>

<script>
  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById(tab + 'Form').classList.add('active');
    });
  });

  // Demo: redirect to dashboard
  function handleLogin(e) {
    e.preventDefault();
    // Simulate: read last stored user or default
    let user = JSON.parse(localStorage.getItem('tambahai_user') || '{}');
    if (!user.email) user = { name: 'Pengguna Demo', email: 'demo@tambah.ai', role: 'operator' };
    localStorage.setItem('tambahai_user', JSON.stringify(user));
    localStorage.setItem('tambahai_token', 'demo-token-' + Date.now());
    window.location.href = 'dashboard.html';
  }

  function handleRegister(e) {
    e.preventDefault();
    const name = e.target[0].value;
    const email = e.target[1].value;
    const role = document.getElementById('roleSelect').value;
    const user = { name, email, role };
    localStorage.setItem('tambahai_user', JSON.stringify(user));
    localStorage.setItem('tambahai_token', 'demo-token-' + Date.now());
    window.location.href = 'dashboard.html';
  }
</script>

</body>
</html>
