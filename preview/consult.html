<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Konsultasi — TambahAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fbfbfd; --surface: #ffffff; --text-primary: #1d1d1f;
      --text-secondary: #6e6e73; --accent: #0071e3; --grad-start: #6e3bfd; --grad-end: #0071e3;
      --border: rgba(0,0,0,0.08); --radius: 16px; --green: #34c759; --user-bubble: #0071e3; --bot-bubble: #f2f2f7;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-primary); line-height: 1.6; height: 100vh; display: flex; flex-direction: column; }

    /* TOP BAR */
    .top-bar {
      height: 52px; min-height: 52px; display: flex; align-items: center; gap: 12px;
      padding: 0 16px; border-bottom: 1px solid var(--border);
      background: rgba(251,251,253,0.85); backdrop-filter: saturate(180%) blur(20px); z-index: 100;
    }
    .back-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--accent); padding: 4px; font-family: inherit; }
    .chat-title { flex: 1; }
    .chat-title h2 { font-size: 1rem; font-weight: 600; }
    .chat-title span { font-size: 0.75rem; color: var(--green); }
    .role-badge { padding: 3px 10px; border-radius: 980px; font-size: 0.7rem; font-weight: 600; }
    .btn-new-chat { background: linear-gradient(135deg,var(--grad-start),var(--grad-end)); color:#fff; border:none; padding: 6px 16px; border-radius: 980px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }

    /* CHAT AREA */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }
    .msg-row { display: flex; gap: 8px; max-width: 85%; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot { align-self: flex-start; }

    .avatar-small {
      width: 30px; height: 30px; min-width: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; color: #fff;
    }
    .avatar-bot { background: linear-gradient(135deg, var(--grad-start), var(--grad-end)); }
    .avatar-user { background: var(--accent); }

    .bubble {
      padding: 12px 16px; border-radius: 18px; font-size: 0.9rem; line-height: 1.55;
    }
    .bot .bubble { background: var(--bot-bubble); border-bottom-left-radius: 6px; }
    .user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 6px; }

    .solution-block {
      background: rgba(52,199,89,0.05); border: 1px solid rgba(52,199,89,0.15);
      border-radius: 12px; padding: 16px; margin-top: 8px;
    }
    .solution-block h4 { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--green); }
    .solution-block ol { padding-left: 20px; }
    .solution-block li { font-size: 0.85rem; margin-bottom: 6px; line-height: 1.5; }
    .solution-block li strong { color: var(--text-primary); }

    .typing-indicator {
      display: inline-flex; gap: 4px; padding: 14px 18px; background: var(--bot-bubble);
      border-radius: 18px; border-bottom-left-radius: 6px;
    }
    .typing-indicator span {
      width: 8px; height: 8px; background: #a1a1a6; border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-7px)} }

    /* DATE DIVIDER */
    .date-divider {
      text-align: center; font-size: 0.75rem; color: var(--text-secondary);
      padding: 12px 0; position: relative;
    }
    .date-divider::before, .date-divider::after {
      content: ''; position: absolute; top: 50%; width: calc(50% - 60px); height: 1px; background: var(--border);
    }
    .date-divider::before { left: 0; }
    .date-divider::after { right: 0; }

    /* INPUT AREA */
    .input-area {
      padding: 12px 16px 24px; background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .input-wrap {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 24px; padding: 6px 6px 6px 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,0.08); }
    .input-wrap textarea {
      flex: 1; border: none; background: none; resize: none;
      font-family: inherit; font-size: 0.92rem; line-height: 1.45;
      outline: none; padding: 8px 0; max-height: 120px;
    }
    .send-btn {
      width: 38px; height: 38px; min-width: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
      border: none; color: #fff; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, transform 0.2s;
    }
    .send-btn:hover { opacity: 0.9; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .hint-text { font-size: 0.75rem; color: var(--text-secondary); text-align: center; margin-top: 8px; }

    @media (max-width: 480px) {
      .chat-title span { display: none; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <button class="back-btn" onclick="window.history.back()">←</button>
  <div class="chat-title">
    <h2>Konsultasi Bisnis</h2>
    <span>● Online — AI siap membantu</span>
  </div>
  <span class="role-badge" id="roleBadge"></span>
  <button class="btn-new-chat" onclick="newChat()">+ Baru</button>
</div>

<!-- CHAT AREA -->
<div class="chat-area" id="chatArea">
  <!-- Bot welcome -->
  <div class="msg-row bot">
    <div class="avatar-small avatar-bot">TA</div>
    <div class="bubble">Halo! 👋 Saya TambahAI.</div>
  </div>
  <div class="msg-row bot">
    <div class="avatar-small avatar-bot"></div>
    <div class="bubble">Ceritakan saja masalah bisnismu secara santai — saya akan analisa dan buatkan solusi yang bisa langsung kamu jalankan. 🚀</div>
  </div>
</div>

<!-- INPUT -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="msgInput" rows="1" placeholder="Ceritakan masalah bisnismu..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="hint-text">Tekan Enter untuk kirim · Shift+Enter untuk baris baru</div>
</div>

<script>
  // Role badge
  const user = JSON.parse(localStorage.getItem('tambahai_user') || '{}');
  if (!user.name) { window.location.href = 'login.html'; }
  const badge = document.getElementById('roleBadge');
  badge.textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
  badge.className = 'role-badge role-' + user.role;

  const chatArea = document.getElementById('chatArea');
  const msgInput = document.getElementById('msgInput');

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function addMessage(text, type) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + type;
    const isBot = type === 'bot';
    row.innerHTML = `
      <div class="avatar-small ${isBot ? 'avatar-bot' : 'avatar-user'}">${isBot ? 'TA' : 'Me'}</div>
      <div class="bubble">${text}</div>`;
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingMsg';
    row.innerHTML = `
      <div class="avatar-small avatar-bot">TA</div>
      <div class="typing-indicator"><span></span><span></span><span></span></div>`;
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingMsg');
    if (el) el.remove();
  }

  function formatDate(d) {
    return d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  }

  function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ── DEMO AI RESPONSES ──
  const demoResponses = [
    `<strong>Baik, saya sudah analisa masalahmu. Berikut solusinya:</strong>
<div class="solution-block">
  <h4>✅ Strategi Rekomendasi</h4>
  <ol>
    <li><strong>Evaluasi produk</strong> — Cek 3 produk dengan penjualan terendah. Pertimbangkan untuk digantikan atau di-discount bundle.</li>
    <li><strong>Marketing digital</strong> — Mulai iklan Instagram Ads dengan budget Rp50rb/hari, target audiens lokal radius 10km.</li>
    <li><strong>Loyalty program</strong> — Buat sistem poin: setiap 5 belanja → diskon 15%. Ini terbukti naikin repeat rate hingga 35%.</li>
    <li><strong>Optimasi jam buka</strong> — Analisa peak hour pelanggan, pastikan stok dan staff cukup di jam sibuk.</li>
  </ol>
</div>
<div class="bubble" style="margin-top:8px;">Estimasi timeline: 2-4 minggu untuk hasil signifikan. Mau saya jelaskan detail tiap langkah?</div>`,

    `<strong>Saya paham situasimu. Berikut analisa dan rencana aksinya:</strong>
<div class="solution-block">
  <h4>✅ Strategi Rekomendasi</h4>
  <ol>
    <li><strong>Tentukan positioning</strong> — Bisnismu unggul di aspek apa? Harga terjangkau? Kualitas premium? Layanan cepat? Fokuskan branding ke satu keunggulan utama.</li>
    <li><strong>Customer feedback loop</strong> — Pasang QR code di checkout/link WA otomatis untuk minta review. Reward reviewer dapat voucher.</li>
    <li><strong>Kolaborasi UMKM lokal</strong> — Cross-promo sama bisnis komplementer. Contoh: coffee shop × bakery bagikan promo timbal balik.</li>
    <li><strong>Tracking metrics</strong> — Catat 3 angka penting tiap minggu: total omzet, customer baru vs lama, rata-rata nilai transaksi.</li>
  </ol>
</div>
💡 Tips tambahan: konsistensi lebih penting daripada sempurna. Mulai dari satu strategi dulu ya!`,

    `<strong>Ini masalah umum, tapi ada solusinya. Baca langkah-langkah ini:</strong>
<div class="solution-block">
  <h4>✅ Strategi Rekomendasi</h4>
  <ol>
    <li><strong>Buat SOP sederhana</strong> — Tuliskan 5 proses inti bisnis (penerimaan order, packing, pengiriman, pembayaran, handling komplain). Setiap proses harus punya checklist.</li>
    <li><strong>Sistem insentif</strong> — Gaji pokok + bonus based KPI. Example: kalau target penjualan terpenuhi → bonus 10% dari kelebihan target.</li>
    <li><strong>Weekly meeting 30 menit</strong> — Setiap Senin pagi review minggu lalu + set goal minggu ini. Singkat tapi rutin bikin tim stay aligned.</li>
    <li><strong>Digital tool gratis</strong> — Pakai Google Forms untuk absensi, Notion atau Trello for task management, WhatsApp Business for customer care.</li>
  </ol>
</div>
Konsisten dalam 30 hari pertama adalah kunci perubahan budaya kerja. 💪`
  ];

  let responseIndex = 0;

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    msgInput.value = '';
    msgInput.style.height = 'auto';

    showTyping();

    setTimeout(() => {
      removeTyping();
      const response = demoResponses[responseIndex % demoResponses.length];
      responseIndex++;
      addMessage(response, 'bot');
    }, 1500 + Math.random() * 1500);
  }

  function newChat() {
    chatArea.innerHTML = '';
    responseIndex = 0;
    addMessage('Halo! 👋 Chat baru dimulai.', 'bot');
    addMessage('Apa yang bisa saya bantu seputar bisnismu hari ini?', 'bot');
  }

  // Auto focus
  msgInput.focus();
</script>

</body>
</html>
